# golangci-lint v2 configuration.
# Validate with: just lint-config
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # The upstream default set: errcheck, govet, ineffassign, staticcheck, unused.
  # v2 has no preset literally named "recommended"; "standard" is it.
  default: standard

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/GyeongHoKim/swarmmux

issues:
  # Report every finding rather than the default per-linter cap of 3.
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
